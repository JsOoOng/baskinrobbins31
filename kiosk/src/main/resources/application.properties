spring.application.name=kiosk
server.port=8889
server.printPort=7777

# JWT 비밀키는 GitHub Actions/EC2 환경변수에서 주입합니다.
jwt.secret=${JWT_SECRET}
# 기본값 72,000,000ms = 20시간이며 비밀정보는 아닙니다.
jwt.expiration-time=${JWT_EXPIRATION_TIME:72000000}

