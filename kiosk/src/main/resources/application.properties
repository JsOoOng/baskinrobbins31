# =========================================================
# 3. JPA Hibernate
# =========================================================
#spring.jpa.hibernate.ddl-auto=create 
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# =========================================================
# 4. MyBatis
# =========================================================
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# =========================================================
# 5. Etc
# =========================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
# 맛 이미지 영구 저장 위치. 운영 서버에서는 FLAVOR_UPLOAD_DIR을 영구 볼륨 경로로 지정합니다.
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.leak-detection-threshold=10000

# =========================================================
# 6. Toss Payments API
# =========================================================
toss.secret-key=test_sk_PBal2vxj811glNODl9dk85RQgOAN
spring.jpa.defer-datasource-initialization=true

#spring.sql.init.mode=always
spring.sql.init.mode=never

spring.sql.init.data-locations=classpath:init_data.sql
spring.sql.init.encoding=UTF-8
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4

# =========================================================
# 7. Cloudflare Turnstile
# =========================================================
cloudflare.turnstile.secret-key=0x4AAAAAAEF4jKbu4JipMgJ4wtm6z3NUT-k
#cloudflare.turnstile.secret-key=1x0000000000000000000000000000000AA

# 기존 로컬 이미지 호환용
app.upload.flavor-directory=${FLAVOR_UPLOAD_DIR:./data/flavors}

# Amazon S3
aws.region=${AWS_REGION:ap-northeast-2}
aws.s3.bucket=${AWS_S3_BUCKET:icecreamflavorimage-storage}
aws.s3.flavor-prefix=uploads/flavors
# 화면에서 사용할 임시 이미지 주소의 유효 시간
aws.s3.presigned-url-minutes=30

# =========================================================
# log.info X
# =========================================================
logging.level.root=INFO
logging.level.com.kiosk=DEBUG

