#  ===================================================== ====
# 1. Spring Boot Default
# =========================================================
spring.application.name=kiosk
server.port=8889
server.printPort=7777

# JWT 비밀키는 GitHub Actions/EC2 환경변수에서 주입합니다.
#jwt.secret=${JWT_SECRET}
jwt.secret=mySecretKeymySecretKeymySecretKey123456
# 기본값 72,000,000ms = 20시간이며 비밀정보는 아닙니다.
#jwt.expiration-time=${JWT_EXPIRATION_TIME:72000000}
jwt.expiration-time=72000000
# ========================================================
# 2. MySQL
# ========================================================
# 운영 DB 정보는 GitHub Secrets에서 EC2의 보호된 환경파일로 전달합니다.
# 재부팅하더라도 systemd가 /etc/kiosk/kiosk.env에서 이 값을 다시 읽습니다.
spring.datasource.url=jdbc:mysql://${RDS_ENDPOINT}:3306/kiosk?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useUnicode=true&sslMode=VERIFY_IDENTITY
spring.datasource.username=${RDS_USERNAME}
spring.datasource.password=${RDS_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#spring.datasource.url=jdbc:mysql://localhost:3308/kiosk?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useUnicode=true&sslMode=DISABLED&allowPublicKeyRetrieval=true
#spring.datasource.username=root
#spring.datasource.password=1234
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# 3. JPA Hibernate
# =========================================================
#spring.jpa.hibernate.ddl-auto=create 
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# =========================================================
# 4. MyBatis
# =========================================================
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# =========================================================
# 5. Etc
# =========================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
# 맛 이미지 영구 저장 위치. 운영 서버에서는 FLAVOR_UPLOAD_DIR을 영구 볼륨 경로로 지정합니다.
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.leak-detection-threshold=10000

# =========================================================
# 6. Toss Payments API
# =========================================================
#toss.secret-key=${TOSS_SECRET_KEY}
toss.secret-key=test_sk_PBal2vxj811glNODl9dk85RQgOAN
spring.jpa.defer-datasource-initialization=true

#spring.sql.init.mode=always
spring.sql.init.mode=never

spring.sql.init.data-locations=classpath:init_data.sql
spring.sql.init.encoding=UTF-8
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4

# =========================================================
# 7. Cloudflare Turnstile
# =========================================================
cloudflare.turnstile.secret-key=${TURNSTILE_SECRET_KEY}
#cloudflare.turnstile.secret-key=1x0000000000000000000000000000000AA

# 기존 로컬 이미지 호환용
app.upload.flavor-directory=${FLAVOR_UPLOAD_DIR:./data/flavors}

# Amazon S3
aws.region=${AWS_REGION:ap-northeast-2}
aws.s3.bucket=${AWS_S3_BUCKET:icecreamflavorimage-storage}
aws.s3.flavor-prefix=uploads/flavors
# 화면에서 사용할 임시 이미지 주소의 유효 시간
aws.s3.presigned-url-minutes=30

# =======================================================
# 운영 로그 레벨: 외부 라이브러리는 WARN 이상, 프로젝트는 INFO 이상 기록
# =======================================================
logging.level.root=WARN
logging.level.com.kiosk=INFO

# 오류 응답에 내부 예외·스택 정보가 자동 포함되지 않도록 운영 기본값을 고정합니다.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.whitelabel.enabled=false
