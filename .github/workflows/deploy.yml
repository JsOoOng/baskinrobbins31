name: Deploy to EC2

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 코드 체크아웃 (Checkout Code)
      uses: actions/checkout@v3

    # ==========================================
    # 백엔드 (Spring Boot) 빌드
    # ==========================================
    - name: 2. Java 21 환경 세팅 (Set up JDK 21)
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: 3. 백엔드 빌드 (Build Spring Boot)
      run: |
        cd kiosk
        chmod +x mvnw
        ./mvnw clean package -DskipTests

    # ==========================================
    # 프론트엔드 (Vue/Vite) 빌드
    # ==========================================
    - name: 4. Node.js 20 환경 세팅 (Set up Node.js 20)
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: 5. 프론트엔드 빌드 (Build Vite/Vue)
      run: |
        cd kiosk-frontend
        npm install
        npm run build

    # ==========================================
    # EC2 서버로 전송 및 배포 실행
    # ==========================================
    - name: 6. 빌드 파일 및 스크립트 EC2로 전송 (SCP)
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_KEY }}
        source: "kiosk/target/*.jar, kiosk-frontend/dist/*, deploy.sh"
        target: "/home/ubuntu/kiosk-deploy"
        strip_components: 0

    - name: 7. EC2 배포 스크립트 실행 (SSH)
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          cd /home/ubuntu/kiosk-deploy
          chmod +x deploy.sh
          ./deploy.sh
