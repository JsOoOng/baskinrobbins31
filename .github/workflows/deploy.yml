name: Deploy to EC2 (3-Tier Bastion)

on:
  push:
    branches: [ "dev1_errorVideo" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 코드 체크아웃 (Checkout Code)
      # 공급망 변조를 막기 위해 변경 가능한 태그 대신 전체 commit SHA를 사용합니다.
      uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

    # ==========================================
    # 백엔드 (Spring Boot) 빌드
    # ==========================================
    - name: 2. Java 21 환경 세팅 (Set up JDK 21)
      uses: actions/setup-java@d2bb5a81bf6132351ee9adcc0bba8261a8d34d48
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: 3-1. 백엔드 단위 테스트 (Backend Unit Tests)
      run: |
        cd kiosk
        chmod +x mvnw
        ./mvnw clean test -Dtest=AuthServiceTest,DeliveryCancellationTest,StoreProductUpdateTest,FlavorImageFileStorageTest,HardDeleteConfirmationTest

    - name: 3-2. 백엔드 빌드 (Build Spring Boot)
      run: |
        cd kiosk
        chmod +x mvnw
        ./mvnw clean package -DskipTests

    # ==========================================
    # 프론트엔드 (Vue/Vite) 빌드
    # ==========================================
    - name: 4. Node.js 22 환경 세팅 (Set up Node.js 22)
      uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
      with:
        node-version: '22.18.0'
        cache: 'npm'
        cache-dependency-path: kiosk-frontend/package-lock.json

    - name: 5. 프론트엔드 빌드 (Build Vite/Vue)
      run: |
        cd kiosk-frontend
        npm ci
        npm run build

    # ==========================================
    # 프론트엔드 배포 (Bastion -> Nginx Server)
    # ==========================================
    - name: 6-1. Nginx 서버로 프론트엔드 파일 전송
      uses: appleboy/scp-action@6dba043acb2fa9973346e5025373dd76f2a50779
      with:
        proxy_host: ${{ secrets.BASTION_HOST }}
        proxy_username: ${{ secrets.BASTION_USERNAME }}
        proxy_key: ${{ secrets.BASTION_KEY }}
        host: ${{ secrets.NGINX_HOST }}
        username: ubuntu
        key: ${{ secrets.BASTION_KEY }}
        source: "kiosk-frontend/dist/*, deploy_frontend.sh, nginx/default.conf"
        target: "/home/ubuntu/kiosk-deploy"
        strip_components: 0

    - name: 6-2. Nginx 서버 배포 스크립트 실행
      uses: appleboy/ssh-action@b838bc2f27cd449b957159452d432aff91697637
      with:
        proxy_host: ${{ secrets.BASTION_HOST }}
        proxy_username: ${{ secrets.BASTION_USERNAME }}
        proxy_key: ${{ secrets.BASTION_KEY }}
        host: ${{ secrets.NGINX_HOST }}
        username: ubuntu
        key: ${{ secrets.BASTION_KEY }}
        script: |
          cd /home/ubuntu/kiosk-deploy
          chmod +x deploy_frontend.sh
          # Nginx 설정 파일에서 kiosk-be-internal 호스트를 실제 BE IP로 치환
          sed -i "s/kiosk-be-internal/${{ secrets.BE_HOST }}/g" nginx/default.conf
          ./deploy_frontend.sh

    # ==========================================
    # 백엔드 배포 (Bastion -> BE Server)
    # ==========================================
    - name: 7-1. BE 서버로 백엔드 파일 전송
      uses: appleboy/scp-action@6dba043acb2fa9973346e5025373dd76f2a50779
      with:
        proxy_host: ${{ secrets.BASTION_HOST }}
        proxy_username: ${{ secrets.BASTION_USERNAME }}
        proxy_key: ${{ secrets.BASTION_KEY }}
        host: ${{ secrets.BE_HOST }}
        username: ubuntu
        key: ${{ secrets.BASTION_KEY }}
        source: "kiosk/target/*.jar, deploy_backend.sh"
        target: "/home/ubuntu/kiosk-deploy"
        strip_components: 0

    - name: 7-2. BE 서버 배포 스크립트 실행
      uses: appleboy/ssh-action@b838bc2f27cd449b957159452d432aff91697637
      # Secret을 script 문자열에 직접 삽입하지 않고 Action 환경변수 전달 기능을 사용합니다.
      env:
        RDS_ENDPOINT: ${{ secrets.BE_RDS_ENDPOINT }}
        RDS_USERNAME: ${{ secrets.BE_RDS_USERNAME }}
        RDS_PASSWORD: ${{ secrets.BE_RDS_PASSWORD }}
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
        TOSS_SECRET_KEY: ${{ secrets.TOSS_SECRET_KEY }}
        TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      with:
        proxy_host: ${{ secrets.BASTION_HOST }}
        proxy_username: ${{ secrets.BASTION_USERNAME }}
        proxy_key: ${{ secrets.BASTION_KEY }}
        host: ${{ secrets.BE_HOST }}
        username: ubuntu
        key: ${{ secrets.BASTION_KEY }}
        envs: RDS_ENDPOINT,RDS_USERNAME,RDS_PASSWORD,JWT_SECRET,TOSS_SECRET_KEY,TURNSTILE_SECRET_KEY
        script: |
          cd /home/ubuntu/kiosk-deploy
          chmod +x deploy_backend.sh
          ./deploy_backend.sh
