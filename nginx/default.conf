# 로그인 API는 동일 IP에서 분당 5회까지만 기본 허용합니다.
# 여러 사용자가 같은 공유기를 쓸 수 있으므로 IP 자체를 영구 차단하지 않습니다.
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# HTTP -> HTTPS 리다이렉트
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    server_name baskinrobbins31.store www.baskinrobbins31.store;

	server_tokens off;

    return 301 https://$host$request_uri;

}

# HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    http2 on;

server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 추가 보안 헤더
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # HTTP/2 응답 헤더 값에는 줄바꿈을 넣을 수 없으므로 CSP는 반드시 한 줄로 유지합니다.
    # 승인된 출처만 허용하여 XSS와 클릭재킹 공격을 방어합니다.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://icecreamflavorimage-storage.s3.ap-northeast-2.amazonaws.com; font-src 'self' data:; connect-src 'self' https: wss:; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;

    # Vue 정적 파일 경로
    root /var/www/html/kiosk-frontend;
    index index.html;

    server_name baskinrobbins31.store www.baskinrobbins31.store;

    ssl_certificate /etc/letsencrypt/live/baskinrobbins31.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/baskinrobbins31.store/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    # Vue Router History Mode 처리
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 백엔드 API 프록시 처리
    location /api/ {
        proxy_pass http://kiosk-be-internal:8889/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 지점 로그인 반복 시도 제한: 초과 요청은 429로 응답
    location = /proxy-api/branch/login {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://kiosk-be-internal:8889/branch/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 본사 로그인 반복 시도 제한: 초과 요청은 429로 응답
    location = /proxy-api/head/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://kiosk-be-internal:8889/head/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /proxy-api/ {
        proxy_pass http://kiosk-be-internal:8889/;

        proxy_http_version 1.1;

        # WebSocket 필수
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE/WebSocket timeout
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
