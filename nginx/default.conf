# HTTP -> HTTPS 리다이렉트
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name baskinrobbins31.store www.baskinrobbins31.store;

    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    http2 on;

    # Vue 정적 파일 경로
    root /var/www/html/kiosk-frontend;
    index index.html;

    server_name baskinrobbins31.store www.baskinrobbins31.store;

    ssl_certificate /etc/letsencrypt/live/baskinrobbins31.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/baskinrobbins31.store/privkey.pem;

    # Vue Router History Mode 처리
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 백엔드 API 프록시 처리
    location /api/ {
        proxy_pass http://kiosk-be-internal:8889/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /proxy-api/ {
        proxy_pass http://172.31.41.229:8889/;

        proxy_http_version 1.1;

        # WebSocket 필수
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE/WebSocket timeout
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}