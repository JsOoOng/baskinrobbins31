server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Vue 정적 파일 경로
    root /var/www/html/kiosk-frontend;
    index index.html;

    server_name _;

    # Vue Router History Mode 처리
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 백엔드 API 프록시 처리
    location /api/ {
        # 백엔드 서버의 프라이빗 IP가 들어갈 자리입니다.
        # NGINX_BE_IP 변수는 배포 스크립트 실행 시 텍스트 치환(sed)되거나
        # AWS 내부망 DNS로 매핑하여 사용해야 합니다.
        # 임시로 BE 서버 IP를 설정해야 한다면 여기를 수정하세요.
        proxy_pass http://kiosk-be-internal:8889/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
